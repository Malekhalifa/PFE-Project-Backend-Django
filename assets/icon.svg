<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="QualityLab: a database inspected by a magnifying lens with a check mark">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1fa58f"/>
      <stop offset="1" stop-color="#0d3b3a"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- the database -->
  <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round">
    <ellipse cx="52" cy="32" rx="28" ry="9" fill="#ffffff" fill-opacity=".18"/>
    <path d="M24 32V84c0 5 12.5 9 28 9"/>
    <path d="M80 32V50"/>
    <path d="M24 49c0 5 12.5 9 28 9 6 0 11.5-.6 16-1.6"/>
    <path d="M24 66c0 5 12.5 9 28 9"/>
  </g>
  <!-- rows found and checked -->
  <g fill="#ffffff" fill-opacity=".45">
    <circle cx="36" cy="43" r="2.6"/><circle cx="36" cy="60" r="2.6"/><circle cx="36" cy="77" r="2.6"/>
  </g>
  <!-- the lens -->
  <circle cx="82" cy="78" r="22" fill="#0d3b3a" fill-opacity=".55" stroke="#ffffff" stroke-width="6"/>
  <path d="M98 94l14 14" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
  <path d="M71 78l7.5 7.5L94 70" fill="none" stroke="#ffb547" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
